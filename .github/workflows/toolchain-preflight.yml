name: RKLLM and RKNN toolchain preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-check:
    name: Install and import vendor toolkits
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner and Python environment
        shell: bash
        run: |
          set -euo pipefail
          echo "OS: $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "Architecture: $(uname -m)"
          python3 --version
          python3 -m pip --version
          free -h
          df -h /

      - name: Install system libraries needed by RKNN Toolkit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libgl1 libsm6 libxrender1 libxext6 libgomp1
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install RKLLM Toolkit 1.3.1 in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv-rkllm"
          source "$RUNNER_TEMP/venv-rkllm/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          WHEEL_URL="https://raw.githubusercontent.com/airockchip/rknn-llm/release-v1.3.1/rkllm-toolkit/packages/rkllm_toolkit-1.3.1-cp310-cp310-linux_x86_64.whl"
          curl -fL --retry 3 "$WHEEL_URL" -o "$RUNNER_TEMP/rkllm_toolkit-1.3.1-cp310-cp310-linux_x86_64.whl"
          python -m pip install "$RUNNER_TEMP/rkllm_toolkit-1.3.1-cp310-cp310-linux_x86_64.whl"
          python - <<'PY'
          from importlib.metadata import version
          from rkllm.api import RKLLM
          print("RKLLM Toolkit distribution:", version("rkllm-toolkit"))
          print("RKLLM API import: OK", RKLLM)
          PY

      - name: Install RKNN Toolkit2 2.3.2 in a separate isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv-rknn"
          source "$RUNNER_TEMP/venv-rknn/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "rknn-toolkit2==2.3.2"
          python - <<'PY'
          from importlib.metadata import version
          from rknn.api import RKNN
          print("RKNN Toolkit2 distribution:", version("rknn-toolkit2"))
          print("RKNN API import: OK", RKNN)
          PY

      - name: Summarize preflight scope
        if: always()
        shell: bash
        run: |
          {
            echo "### Scope"
            echo "- Installs RKLLM Toolkit 1.3.1 and RKNN Toolkit2 2.3.2 in separate Python virtual environments."
            echo "- Checks Python imports only; it does not download Gemma-4 weights, export ONNX, convert RKNN/RKLLM models, or use the NanoPi."
            echo "- A successful import does not prove that model conversion or inference will fit the runner's memory."
          } >> "$GITHUB_STEP_SUMMARY"
